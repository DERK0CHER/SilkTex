[package]
name = "silktex-node"
version = "0.1.0"
edition = "2021"
description = "P2P collaboration node for SilkTex — Loro CRDT + libp2p gossipsub"

[[bin]]
name = "silktex-node"
path = "src/main.rs"

[dependencies]
anyhow       = "1"
loro         = "1.10.8"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures      = "0.3"

# P2P stack — Kademlia DHT for internet-wide discovery + circuit relay for NAT traversal
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "dns",
    "noise",
    "yamux",
    "gossipsub",
    "identify",
    "kad",
    "relay",
    "dcutr",
] }
libp2p-swarm = { version = "0.45", features = ["macros"] }
