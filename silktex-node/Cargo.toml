[package]
name = "silktex-node"
version = "0.1.0"
edition = "2021"
description = "P2P collaboration node for SilkTex — Loro CRDT + iroh direct connections"

[[bin]]
name = "silktex-node"
path = "src/main.rs"

[dependencies]
anyhow       = "1"
# CSPRNG for the per-session join secret carried in the session code.
getrandom    = "0.4"
loro         = "1.10.8"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# P2P stack — iroh direct connections (QUIC + DERP relay)
iroh         = "0.98.2"
postcard     = { version = "1", features = ["alloc"] }
data-encoding = "2"

[profile.release]
# Turn silent integer wraparound (e.g. offset arithmetic on untrusted input) into a
# panic instead of a wrong result. Deliberately NOT panic = "abort": the update task
# is isolated by tokio, and aborting would kill the whole collaboration session.
overflow-checks = true
