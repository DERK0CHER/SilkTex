#
# Release manifest for Flathub.
#
# LaTeX tools are provided by org.freedesktop.Sdk.Extension.texlive, mounted
# at /app/texlive and exposed through PATH. There is no host fallback: the
# sandbox never runs the host's pdflatex. Users install the extension with
#   flatpak install flathub org.freedesktop.Sdk.Extension.texlive//25.08
app-id: app.silktex.SilkTex
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: silktex

add-extensions:
  org.freedesktop.Sdk.Extension.texlive:
    directory: texlive
    subdirectories: true
    autodelete: true
    version: '25.08'

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-documents:rw
  - --talk-name=org.freedesktop.portal.OpenURI
  - --env=PATH=/app/texlive/bin:/app/texlive/bin/x86_64-linux:/app/texlive/bin/aarch64-linux:/app/bin:/usr/bin
  - --env=LD_LIBRARY_PATH=/app/texlive/lib
  # Avoid Mesa/Zink EGL startup failures on systems without a usable GPU path.
  - --env=GSK_RENDERER=cairo

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/gtk-doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # silktex-node: P2P sidecar built offline with vendored crates.
  # Before tagging a release, regenerate cargo-sources.json:
  #   python3 flatpak-cargo-generator.py silktex-node/Cargo.lock -o cargo-sources.json
  # (flatpak-cargo-generator.py is in flatpak-builder-tools/cargo/)
  - name: silktex-node
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/silktex-node/cargo
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/silktex-node -t /app/bin/
    sources:
      - type: dir
        path: silktex-node
      - cargo-sources.json

  - name: texlive-extension-point
    buildsystem: simple
    build-commands:
      - mkdir -p /app/texlive

  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UTILS=OFF
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/poppler/poppler.git
        tag: poppler-25.07.0
        commit: e4e52f48c64085dc6fda0befc43843ab72b87b35

  - name: silktex
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - --libdir=lib
    sources:
      - type: dir
        path: .
